# Läuft bei jedem Pull Request nach main und nach jedem Merge auf main.
# Im PR müssen alle Jobs vor dem Merge grün sein. Ein roter Lauf auf main
# wird umgehend per Ticket und Fix-PR behoben, vor jedem Release muss er grün sein.
# Actions sind per Commit-SHA gepinnt (Tags lassen sich verschieben, SHAs nicht),
# Dependabot aktualisiert SHA und Kommentar.
#
# Kein Container-Betrieb, daher ohne den Image-Job der Vorlage. Die Tests selbst
# laufen nicht in der CI: Sie prüfen die Live-Systeme, und das Produktivsystem
# lässt aus externen Netzen nur wenige Zugriffe pro Minute zu. Ausgeführt
# werden sie täglich vom Scheduler im DLA (run-tests.sh) und bei Änderungen
# lokal im Devcontainer, siehe CONTRIBUTING.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Versionen, Testdateien und Skripte prüfen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # run-tests.sh nutzt ein Playwright-Image, dessen Version zu
      # @playwright/test im Lockfile passen muss.
      - name: Playwright-Version in run-tests.sh prüfen
        run: |
          lock=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          image=$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+-[a-z]+' run-tests.sh)
          echo "package-lock.json: ${lock}, run-tests.sh: ${image}"
          if [ "${image}" != "mcr.microsoft.com/playwright:v${lock}-${image##*-}" ]; then
            echo "::error file=run-tests.sh::Image-Tag ${image} passt nicht zu @playwright/test ${lock}"
            exit 1
          fi
          echo "PLAYWRIGHT_IMAGE=${image}" >> "$GITHUB_ENV"
      # Im selben Image wie beim Scheduler: npm ci und alle Testdateien laden,
      # ohne die Tests auszuführen. Findet Syntax- und Importfehler.
      - name: Testdateien laden
        run: |
          docker run --rm -v "$PWD":/work -w /work "$PLAYWRIGHT_IMAGE" \
            bash -c "npm ci && npx playwright test --list"
      - name: Shell-Skripte prüfen
        run: shellcheck run-tests.sh

  trivy-repo:
    name: Trivy (Repo)
    runs-on: ubuntu-24.04
    # Alle npm-Pakete sind devDependencies (auch Playwright, mit dem der
    # Scheduler die Tests ausführt). Trivy überspringt sie sonst.
    env:
      TRIVY_INCLUDE_DEV_DEPS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Erst alle Schweregrade ausgeben (ohne Fehlschlag, auch in der Job-Zusammenfassung),
      # dann nur HIGH und CRITICAL prüfen. Der zweite Lauf nutzt
      # Trivy und Datenbank aus dem ersten.
      # Ohne ignore-unfixed: Funde in Abhängigkeiten werden immer gemeldet.
      # Ohne version: Die Action bringt eine feste Trivy-Version mit, Dependabot aktualisiert beides.
      - name: Repo scannen, alle Schweregrade (Abhängigkeiten, Secrets, Konfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          output: ${{ runner.temp }}/trivy-repo.txt
      - name: Ergebnis ausgeben
        run: |
          cat "$RUNNER_TEMP/trivy-repo.txt"
          {
            echo "### Trivy (Repo): alle Schweregrade"
            echo '```'
            cat "$RUNNER_TEMP/trivy-repo.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Repo prüfen (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true
          cache: false
